[package]
name = "sa2-play"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
description = "Play Iron Gate on the Rust SA2 stage session (window or headless autopilot)"

# Kept out of the sa2 crate so its manifest and lockfile stay unchanged.
[workspace]

[dependencies]
sa2-asset-tools = { path = "../sa2" }
serde_json = "1.0.154"
minifb = { version = "=0.29.0", optional = true, default-features = false }

[features]
default = ["native-window"]
# Headless runs and CI can build with --no-default-features.
native-window = ["dep:minifb"]
