[package]
name = "sonic-advance-assets"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
publish = false
description = "Bounded, source-fingerprinted Sonic Advance ASOE asset research tools"
default-run = "sonic-advance-assets"

# Isolated until the asset workstreams agree a shared workspace and schema.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"
minifb = { version = "=0.29.0", optional = true, default-features = false, features = ["x11"] }

[features]
native-window = ["dep:minifb"]

[[bin]]
name = "sonic-advance-native"
path = "src/bin/native.rs"
