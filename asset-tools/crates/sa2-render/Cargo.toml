[package]
name = "sa2-render"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
description = "Draw path for sa2-runtime: Ninja chunk geometry to wgpu (WebGPU, WebGL2 fallback)"

# Own workspace, like sa2-runtime, so the sa2 crate's lockfile stays unchanged.
[workspace]

[dependencies]
sa2-asset-tools = { path = "../sa2" }
sa2-gx = { path = "../sa2-gx" }
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal", "gles", "webgpu", "webgl"] }
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
pollster = "0.4.0"
png = "0.18.1"
