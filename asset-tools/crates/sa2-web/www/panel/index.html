<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="referrer" content="no-referrer">
<title>Staff panel</title>
<style>
  :root { color-scheme: dark; --bg: #0b0d12; --card: #151922; --line: #262c3a; --fg: #e8e8e8; --dim: #9aa3b5; --accent: #3b82f6; --bad: #ef4444; }
  * { box-sizing: border-box; }
  body { margin: 0; background: var(--bg); color: var(--fg); font: 15px/1.45 system-ui, sans-serif; }
  main { max-width: 68rem; margin: 0 auto; padding: 1rem; display: grid; gap: 1rem; }
  header { display: flex; flex-wrap: wrap; gap: .75rem; align-items: center; justify-content: space-between; }
  h1 { font-size: 1.25rem; margin: 0; }
  h2 { font-size: 1rem; margin: 0 0 .6rem; }
  section, form { background: var(--card); border: 1px solid var(--line); border-radius: .6rem; padding: 1rem; }
  form { max-width: 24rem; margin: 10vh auto 0; display: grid; gap: .75rem; }
  label { display: grid; gap: .25rem; color: var(--dim); font-size: .85rem; }
  input, select, button { font: inherit; color: var(--fg); background: #0f131b; border: 1px solid var(--line); border-radius: .4rem; padding: .5rem .65rem; }
  button { background: var(--accent); border-color: var(--accent); color: #fff; cursor: pointer; }
  button.quiet { background: transparent; border-color: var(--line); color: var(--fg); padding: .25rem .55rem; font-size: .85rem; }
  button.bad { background: transparent; border-color: var(--bad); color: #fca5a5; padding: .25rem .55rem; font-size: .85rem; }
  :focus-visible { outline: 2px solid #fff; outline-offset: 2px; }
  .scroll { overflow-x: auto; }
  table { width: 100%; border-collapse: collapse; }
  th, td { text-align: left; padding: .45rem .5rem; border-top: 1px solid var(--line); vertical-align: top; }
  th { color: var(--dim); font-weight: 500; font-size: .85rem; border-top: 0; }
  td.actions { display: flex; flex-wrap: wrap; gap: .35rem; }
  .dim { color: var(--dim); }
  #error, #note { color: #fca5a5; min-height: 1.4em; margin: 0; }
  #chat { max-height: 22rem; overflow-y: auto; }
  .row { display: flex; flex-wrap: wrap; gap: .5rem; align-items: center; }
  [hidden] { display: none !important; }
</style>
</head>
<body>
<form id="login">
  <h1>Staff panel</h1>
  <label>Username or email <input id="who" autocomplete="username" required></label>
  <label>Password <input id="password" type="password" autocomplete="current-password" required></label>
  <label>Your key file <input id="key" type="file" required></label>
  <button>Sign in</button>
  <p id="error" role="alert"></p>
</form>
<main id="panel" hidden>
  <header>
    <h1>Staff panel</h1>
    <div class="row"><span id="me" class="dim"></span><button id="out" class="quiet">Sign out</button></div>
  </header>
  <p id="note" role="alert"></p>
  <section><h2>Server</h2><div id="status" class="dim"></div></section>
  <section>
    <h2>Players online</h2>
    <div class="row" style="margin-bottom:.6rem">
      <label class="row">Length
        <select id="length">
          <option value="10">10 minutes</option><option value="60">1 hour</option>
          <option value="1440">1 day</option><option value="10080">7 days</option>
          <option value="forever" data-admin>Until lifted (admin)</option>
          <option value="0">Lift</option>
        </select>
      </label>
    </div>
    <div class="scroll"><table><thead><tr><th>Chao</th><th>Account</th><th>Room</th><th>Limits</th><th>Actions</th></tr></thead><tbody id="players"></tbody></table></div>
  </section>
  <section><h2>Chat</h2><div id="chat"></div></section>
  <section>
    <h2>Voice</h2>
    <div class="row">
      <label class="row">Room <select id="room"></select></label>
      <button id="listen" class="quiet">Listen</button>
      <span id="heard" class="dim"></span>
    </div>
    <p class="dim" style="margin:.6rem 0 0">Every listen is written to the audit log. Nothing is recorded.</p>
  </section>
</main>
<script type="module">
const $ = (id) => document.getElementById(id);
// The session token lives only in this variable: closing or reloading the page signs out.
let token = null, role = null, timer = 0;
const el = (tag, text, cls) => { const e = document.createElement(tag); if (text != null) e.textContent = text; if (cls) e.className = cls; return e; };
async function call(path, body) {
  const r = await fetch(path, {
    method: body ? 'POST' : 'GET', cache: 'no-store',
    headers: { 'x-panel-token': token, ...(body && { 'content-type': 'application/json' }) },
    body: body && JSON.stringify(body),
  });
  if (r.status === 404 && !body) { signOut('Signed out. Sign in again.'); throw new Error('signed out'); }
  const data = await r.json().catch(() => ({}));
  if (!r.ok) throw new Error(data.error || `Failed (${r.status})`);
  return data;
}
function signOut(why = '') {
  token = null; clearInterval(timer); listening = false;
  $('panel').hidden = true; $('login').hidden = false; $('error').textContent = why; $('password').value = '';
}
$('out').onclick = () => signOut();
$('login').onsubmit = async (e) => {
  e.preventDefault();
  $('error').textContent = '';
  const key = (await $('key').files[0].text()).trim();
  // Header values are plain ASCII; anything else is not a key.
  if (!/^[\x21-\x7e]{1,128}$/.test(key)) { $('error').textContent = 'That file is not a panel key.'; return; }
  const r = await fetch('/api/panel/login', {
    method: 'POST', cache: 'no-store',
    headers: { 'content-type': 'application/json', 'x-admin-key': key },
    body: JSON.stringify({ login: $('who').value, password: $('password').value }),
  }).catch(() => null);
  const data = r ? await r.json().catch(() => ({})) : {};
  if (!r?.ok) { $('error').textContent = data.error || 'Could not reach the server.'; return; }
  ({ token, role } = data);
  $('me').textContent = `${data.username} (${role})`;
  for (const o of document.querySelectorAll('[data-admin]')) o.hidden = role !== 'admin';
  $('login').hidden = true; $('panel').hidden = false; $('password').value = ''; $('key').value = '';
  refresh(); timer = setInterval(refresh, 5000);
};
const until = (t) => !t ? null : t > 4e12 ? 'until lifted' : `until ${new Date(t * 1000).toLocaleString()}`;
const span = (s) => { const m = Math.floor(s / 60), h = Math.floor(m / 60), d = Math.floor(h / 24); return d ? `${d} d ${h % 24} h` : h ? `${h} h ${m % 60} min` : `${m} min`; };
async function act(player, kind) {
  const raw = $('length').value, minutes = raw === 'forever' ? raw : Number(raw);
  if (kind === 'ban' && minutes !== 0 && !confirm(`Ban ${player.name}?`)) return;
  $('note').textContent = '';
  try { await call('/api/panel/sanction', { playerId: player.id, kind, minutes }); await refresh(); }
  catch (e) { $('note').textContent = e.message; }
}
async function refresh() {
  if (!token) return;
  try {
    const [status, list, chat] = await Promise.all([call('/api/panel/status'), call('/api/panel/players'), call('/api/panel/chat')]);
    $('status').textContent = `${status.online} online · up ${span(status.uptimeSeconds)}`
      + (status.listening?.length ? ` · listening: ${status.listening.map((l) => `${l.staff} in ${l.room}`).join(', ')}` : '');
    const rows = list.players.map((p) => {
      const tr = el('tr');
      const limits = [['chat muted', p.limits.chatUntil], ['voice muted', p.limits.voiceUntil], ['banned', p.limits.banUntil]]
        .filter(([, t]) => t).map(([n, t]) => `${n} ${until(t)}`).join('; ');
      tr.append(el('td', p.name), el('td', (p.account ?? 'no account') + (p.role ? ` (${p.role})` : '')), el('td', p.room), el('td', limits || 'none', 'dim'));
      const actions = el('td', null, 'actions');
      for (const [label, kind, cls] of [['Mute chat', 'chat', 'quiet'], ['Mute voice', 'voice', 'quiet'], ['Kick', 'kick', 'bad'], ['Ban', 'ban', 'bad']]) {
        const b = el('button', label, cls); b.onclick = () => act(p, kind); actions.append(b);
      }
      tr.append(actions);
      return tr;
    });
    $('players').replaceChildren(...(rows.length ? rows : [el('tr')]));
    if (!rows.length) $('players').firstChild.append(Object.assign(el('td', 'Nobody is online.', 'dim'), { colSpan: 5 }));
    const rooms = [...new Set(list.players.map((p) => p.room))].sort(), chosen = $('room').value;
    $('room').replaceChildren(...rooms.map((r) => Object.assign(el('option', r), { value: r })));
    if (rooms.includes(chosen)) $('room').value = chosen;
    $('chat').replaceChildren(...chat.lines.map((l) => {
      const row = el('div', null, 'row');
      const del = el('button', 'Delete', 'bad');
      del.onclick = async () => { try { await call('/api/panel/chat/delete', { line: l.line }); refresh(); } catch (e) { $('note').textContent = e.message; } };
      row.append(del, el('span', `${new Date(l.at * 1000).toLocaleTimeString()} [${l.channel === 'world' ? 'World' : l.room}]`, 'dim'), el('span', `${l.fromName}: ${l.text}`));
      return row;
    }));
    if (!chat.lines.length) $('chat').append(el('div', 'No chat yet.', 'dim'));
  } catch (e) { if (token) $('note').textContent = e.message; }
}
// Voice: 16-bit 8 kHz mono frames, the same form the game page plays.
let listening = false, audio = null, after = 0;
const playAt = new Map();
$('listen').onclick = async () => {
  listening = !listening;
  $('listen').textContent = listening ? 'Stop' : 'Listen';
  $('heard').textContent = '';
  if (!listening) return;
  audio ??= new AudioContext();
  await audio.resume();
  after = 0;
  let first = true;
  while (listening && token) {
    try {
      const room = $('room').value;
      if (!room) { $('heard').textContent = 'No room to listen to.'; break; }
      const { frames } = await call(`/api/panel/voice?room=${encodeURIComponent(room)}&after=${after}`);
      for (const f of frames) {
        after = Math.max(after, f.frame);
        if (first) continue; // frames from before this sitting are skipped
        const bytes = Uint8Array.from(atob(f.data), (c) => c.charCodeAt(0));
        const pcm = new Int16Array(bytes.buffer, 0, bytes.length >> 1);
        const buf = audio.createBuffer(1, pcm.length, 8000);
        buf.getChannelData(0).set(Float32Array.from(pcm, (v) => v / 32768));
        const node = audio.createBufferSource();
        node.buffer = buf; node.connect(audio.destination);
        const at = Math.max(audio.currentTime + 0.05, playAt.get(f.fromId) ?? 0);
        node.start(at); playAt.set(f.fromId, at + buf.duration);
        $('heard').textContent = `${f.fromName} is talking`;
      }
      first = false;
    } catch (e) { $('heard').textContent = e.message; break; }
    await new Promise((r) => setTimeout(r, 300));
  }
  listening = false; $('listen').textContent = 'Listen';
};
</script>
</body>
</html>
