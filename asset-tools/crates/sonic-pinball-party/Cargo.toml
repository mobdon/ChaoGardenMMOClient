[package]
name = "sonic-pinball-party"
version = "0.1.0"
edition = "2021"
rust-version = "1.88"
description = "Local, version-gated Sonic Pinball Party A3VE asset inspection"
publish = false

# Independently buildable until the asset workstreams agree a shared workspace.
[workspace]

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha1 = "0.10"
sha2 = "0.10"

[[bin]]
name = "spp-assets"
path = "src/main.rs"
