[package]
name = "sa2-gx"
version = "0.1.0"
edition = "2021"
rust-version = "1.100"
publish = false
license = "MIT"
description = "GameCube GX on wgpu: noclip.website's generic GX code (MIT) translated to Rust, plus a GX-API-shaped state machine for the recompiled game"

# Own workspace, like sa2-render and sa2-runtime.
[workspace]

[dependencies]
wgpu = { version = "30.0.1", default-features = false, features = ["std", "wgsl", "dx12", "vulkan", "metal", "gles", "webgpu", "webgl"] }
bytemuck = { version = "1.25.2", features = ["derive"] }

[dev-dependencies]
pollster = "0.4.0"
naga = { version = "30.0.2", features = ["wgsl-in"] }
